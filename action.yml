name: 'Designesy Score'
description: 'Score your PR preview deployment against the 44-check Designesy design-contract engine. Posts a sticky comment with the score, grade, and failing checks.'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  url:
    description: 'The URL to score (e.g. your PR preview deployment URL). Either this or `url-command` is required.'
    required: false
    default: ''
  url-command:
    description: 'A shell command whose stdout is the URL to score (e.g. `echo $VERCEL_URL`). Use this when the preview URL is only available at runtime.'
    required: false
    default: ''
  scope:
    description: 'Scoring scope: contract (strict) or universal (fair, default).'
    required: false
    default: 'universal'
  min-score:
    description: 'Fail the step (exit 1) if the score is below this number (0-100). Default 0 = disabled.'
    required: false
    default: '0'
  min-grade:
    description: 'Fail the step (exit 1) if the grade is worse than this letter (A/B/C/D/F). Default empty = disabled.'
    required: false
    default: ''
  format:
    description: 'Engine output format: designesy (default), canonical, review, google. Only designesy and canonical carry per-check counts; for the other formats the action reads the designesy result.'
    required: false
    default: 'designesy'
  fail-on-error:
    description: 'Fail the step if the scoring engine itself errors (network failure, invalid URL). Set to false to allow the step to pass even on errors.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for posting PR comments. Defaults to the workflow token (github.token), which needs `pull-requests: write`. A failed comment post is a warning and never fails the step.'
    required: false
    default: ${{ github.token }}
  engine-version:
    description: "Version of @designesy/score to run: 'latest' (default) or an exact version such as 0.7.2. Pin to keep a CI gate stable across engine releases."
    required: false
    default: 'latest'
outputs:
  score:
    description: 'Numeric score (0-100).'
  grade:
    description: 'Letter grade (A-F).'
  pass:
    description: 'Number of passing checks.'
  warn:
    description: 'Number of warning checks.'
  fail:
    description: 'Number of failing checks.'
  skip:
    description: 'Number of skipped checks.'
  manual:
    description: 'Number of checks that need a manual or browser-trace review.'
  total:
    description: 'Total checks the engine ran, as reported by the engine.'
  contract-version:
    description: 'Design-contract version the engine scored against, as reported by the engine.'
  engine-version:
    description: "Version of @designesy/score that ran. With engine-version: latest this is the exact version the registry resolved, or 'latest' if that lookup failed."
runs:
  using: 'node24'
  main: 'dist/index.js'