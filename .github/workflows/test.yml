name: Verify action

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Verify the action builds and the bundle is committed
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify dist is up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

  # Self-test: score example.com (a known low-scorer) and verify the action
  # runs without crashing and produces expected outputs
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score example.com
        id: score
        uses: ./
        with:
          url: https://example.com
          fail-on-error: 'false'
      - name: Verify outputs are set
        run: |
          echo "Score: ${{ steps.score.outputs.score }}"
          echo "Grade: ${{ steps.score.outputs.grade }}"
          echo "Pass: ${{ steps.score.outputs.pass }}"
          echo "Fail: ${{ steps.score.outputs.fail }}"
          if [ -z "${{ steps.score.outputs.score }}" ]; then
            echo "::error::score output was not set"
            exit 1
          fi
          if [ -z "${{ steps.score.outputs.grade }}" ]; then
            echo "::error::grade output was not set"
            exit 1
          fi
      - name: Verify latest resolved to an exact engine version
        env:
          ENGINE_VERSION: ${{ steps.score.outputs.engine-version }}
        run: |
          echo "Engine: $ENGINE_VERSION"
          if ! printf '%s' "$ENGINE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::engine-version output is '$ENGINE_VERSION', not an exact version"
            exit 1
          fi

  # Self-test: a pinned engine runs exactly that version
  self-test-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score example.com on engine 0.7.2
        id: score
        uses: ./
        with:
          url: https://example.com
          engine-version: '0.7.2'
          fail-on-error: 'false'
      - name: Verify the pinned version ran
        env:
          ENGINE_VERSION: ${{ steps.score.outputs.engine-version }}
          SCORE: ${{ steps.score.outputs.score }}
        run: |
          echo "Engine: $ENGINE_VERSION  Score: $SCORE"
          if [ "$ENGINE_VERSION" != "0.7.2" ]; then
            echo "::error::engine-version output is '$ENGINE_VERSION', expected 0.7.2"
            exit 1
          fi
          if [ -z "$SCORE" ]; then
            echo "::error::score output was not set"
            exit 1
          fi

  # Self-test: an engine-version that is not 'latest' or x.y.z fails the step
  # before anything runs, and is never handed to a shell
  self-test-invalid-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score with an invalid engine-version
        id: score
        continue-on-error: true
        uses: ./
        with:
          url: https://example.com
          engine-version: '0.7.2; touch /tmp/engine-version-injected'
      - name: Verify the step failed and nothing ran
        env:
          OUTCOME: ${{ steps.score.outcome }}
          SCORE: ${{ steps.score.outputs.score }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::an invalid engine-version did not fail the step (outcome: $OUTCOME)"
            exit 1
          fi
          if [ -n "$SCORE" ]; then
            echo "::error::score output was set, so the engine ran"
            exit 1
          fi
          if [ -e /tmp/engine-version-injected ]; then
            echo "::error::the engine-version value reached a shell"
            exit 1
          fi

  # Score designesy.org — should be an A
  score-designesy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score designesy.org
        id: score
        uses: ./
        with:
          url: https://www.designesy.org
          fail-on-error: 'false'
      - name: Report
        run: |
          echo "Designesy.org score: ${{ steps.score.outputs.score }} (${{ steps.score.outputs.grade }})"